openapi: 3.0.3
info:
  title: Reviewer Chat Completions dependency subset
  version: 1.0.0
  description: Non-streaming subset verified from official OpenAI documentation; compatible providers may vary. No live credentials.
servers:
  - url: https://api.openai.com/v1
paths:
  /chat/completions:
    post:
      operationId: reviewerChatCompletion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, stream]
              properties:
                model: { type: string }
                stream: { type: boolean, enum: [false] }
                messages:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [system, user] }
                      content: { type: string }
                response_format:
                  type: object
                  properties:
                    type: { type: string, enum: [json_object] }
      responses:
        '200':
          description: One complete assistant JSON object encoded as content text
          content:
            application/json:
              schema:
                type: object
                required: [choices]
                properties:
                  choices:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [message, finish_reason]
                      properties:
                        finish_reason: { type: string }
                        message:
                          type: object
                          required: [content]
                          properties:
                            content: { type: string }
              example:
                choices:
                  - finish_reason: stop
                    message: { role: assistant, content: '{"differences":[],"uncertainty":[]}' }
        '401': { description: Authentication failed }
        '403': { description: Access denied }
        '429': { description: Rate limited }
        '500': { description: Provider error }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
