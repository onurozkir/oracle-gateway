name: Quality and cooperative demo
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo:wrong
      - run: npm run demo:correct
      - run: npm run benchmark
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cooperative-reports-${{ matrix.os }}-${{ matrix.node }}
          path: .oracle-gate/runs/
